name: Canonical Model Schema

on:
  push:
    branches: [ main ]
    paths:
      - 'schemas/**'
      - 'tools/validate_schema.py'
      - 'tools/canonicalize_json.py'
      - 'requirements-ci.txt'
      - '.github/workflows/schema.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'tools/validate_schema.py'
      - 'tools/canonicalize_json.py'
      - 'requirements-ci.txt'
      - '.github/workflows/schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          check-latest: false
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned schema validator
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate schema and fixtures
        run: python tools/validate_schema.py

      - name: Verify canonical JSON serialization is reproducible
        run: |
          python tools/canonicalize_json.py schemas/examples/minimal.valid.json /tmp/model-a.json
          python tools/canonicalize_json.py schemas/examples/minimal.valid.json /tmp/model-b.json
          cmp /tmp/model-a.json /tmp/model-b.json
          sha256sum /tmp/model-a.json /tmp/model-b.json
