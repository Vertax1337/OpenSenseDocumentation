name: Core Parser

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-tests:
    name: Parser / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile parser
        run: python -m compileall -q src/Parser

      - name: Run parser regression tests
        run: python -m unittest discover -s tests/Parser -v

      - name: Validate base schema fixtures
        run: python tools/validate_schema.py
